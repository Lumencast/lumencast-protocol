name: bundle-x-zab-capture-media-file
description: RFC-0001 Amendment 2 An `x-zab.capture` of class `media.file` (authored media playback, resolved to a native decoder by the consuming app) is structurally valid. It is a VISUAL kind, so `size` is required, and it carries only a logical `x-zab.deviceRef` — never a path, an asset id or any host-local reference. (RFC-0001 Amendment 2 §A2.2).
tag: required
target: runtime
spec_refs:
  - LSML-1#171-vendor-prefixed-primitive-kind-values-11
  - LSML-1#173-capability-profiles-11

bundles:
  - id: capture-media-file-bundle
    inline:
      $schema: https://lumencast.dev/schema/lsml/1.1/schema.json
      lsml: "1.1"
      scene_id: capture-media-file
      scene_version: sha256:f11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11ef11e
      profiles:
        - x-zab.capture/1
      layout:
        kind: frame
        size: { w: 1920, h: 1080 }
        children:
          - kind: x-zab.capture
            id: intro
            x-zab.sourceKind: media.file
            x-zab.deviceRef: intro-sting
            size: { w: 1920, h: 1080 }

steps:
  - kind: client-sends
    frame:
      v: 1
      type: subscribe
      token: $TOKEN_OPERATOR

  - kind: server-sends
    frame:
      v: 1
      type: snapshot
      seq: 1
      scene_id: capture-media-file
      scene_version: $ANY_HASH
      state: $ANY
