name: bundle-x-zab-capture-media-file-no-size-rejected
description: "RFC-0001 Amendment 2 An `x-zab.capture` of class `media.file` without `size` MUST be rejected with `INVALID_VALUE`. `media.file` is a VISUAL kind: the placeholder's geometry is what lets the consuming app position the native source over the exact box the author drew, so a zero-area media box is malformed, not a degraded case. This scenario is what an implementation extending the source-kind enum WITHOUT extending the visual-kind set would silently accept. (RFC-0001 Amendment 2 §A2.2/§A2.4)."
tag: required
target: server
spec_refs:
  - LSML-1#171-vendor-prefixed-primitive-kind-values-11
  - ERROR-CODES#invalid_value

bundles:
  - id: capture-media-file-no-size-bundle
    inline:
      $schema: https://lumencast.dev/schema/lsml/1.1/schema.json
      lsml: "1.1"
      scene_id: capture-media-file-no-size
      scene_version: sha256:badf11ebadf11ebadf11ebadf11ebadf11ebadf11ebadf11ebadf11ebadf11eb
      profiles:
        - x-zab.capture/1
      layout:
        kind: frame
        size: { w: 1920, h: 1080 }
        children:
          - kind: x-zab.capture
            id: intro
            x-zab.sourceKind: media.file
            x-zab.deviceRef: intro-sting

steps:
  - kind: client-sends
    frame:
      v: 1
      type: subscribe
      token: $TOKEN_OPERATOR

  - kind: server-sends
    frame:
      v: 1
      type: error
      seq: 1
      code: INVALID_VALUE
      message: $ANY
      recoverable: false
